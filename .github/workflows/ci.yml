name: CI

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ConcurrencyPokedex

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Resolve SPM
        run: xcodebuild -resolvePackageDependencies -project ConcurrencyPokedex.xcodeproj
        
      - name: Build
        run: |
          xcodebuild \
            -project ConcurrencyPokedex.xcodeproj \
            -scheme ConcurrencyPokedex \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,OS=18.5,name=iPhone 16' \
            build
            
  test:
    runs-on: macos-latest
    needs: build
    defaults:
      run:
        working-directory: ConcurrencyPokedex
    steps:
      - uses: actions/checkout@v4
      
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
        
      - name: Test
        run: |
          xcodebuild \
            -project ConcurrencyPokedex.xcodeproj \
            -scheme ConcurrencyPokedex \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,OS=18.5,name=iPhone 16' \
            -skip-testing:ConcurrencyPokedexUITests \
            -skip-testing:ConcurrencyPokedexTests/ConcurrencySnapShotTests \
            test

