name: CI

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Resolve SPM
        run: xcodebuild -resolvePackageDependencies -project ConcurrencyPokedex.xcodeproj
        
      - name: Build
        run: |
          xcodebuild \
            -project ConcurrencyPokedex.xcodeproj \
            -scheme ConcurrencyPokedex \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,OS=18.5,name=iPhone 16' \
            build
            
  test:
    runs-on: macos-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
        
      - name: Test
        run: |
          xcodebuild \
            -project ConcurrencyPokedex.xcodeproj \
            -scheme ConcurrencyPokedex \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,OS=18.5,name=iPhone 16' \
            test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            test-results.xml
            TestResults.xcresult

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action/macos@v2
        if: always()
        with:
          files: test-results.xml
